# Render Blueprint: Dashboard > New > Blueprint > pick this repository.
# Render asks for each "sync: false" value once; paste them there, never in the repo.
services:
  - type: web
    name: quoteflow
    runtime: node
    region: virginia
    plan: free # sleeps after 15 idle minutes; keep it awake with a 10-minute ping to /api/health
    # Vite and Tailwind are dev dependencies, so install them for the build.
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      # 24 runs the shared TypeScript pricing code with built-in type stripping.
      - key: NODE_VERSION
        value: "24"
      # PayPal Developer Dashboard > Apps & Credentials > Sandbox > your app.
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SECRET_KEY
        sync: false
      - key: SUPABASE_PUBLISHABLE_KEY
        sync: false
      # Shared demo owner password; Render makes a random one.
      - key: DEMO_OWNER_PASSWORD
        generateValue: true
